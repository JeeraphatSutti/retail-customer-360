retail_360:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: silver
      location: "{{ env_var('BQ_LOCATION', 'asia-southeast1') }}"
      keyfile: /opt/airflow/credentials/gcp-sa.json
      threads: 4